name: Documentation and release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y groff ikiwiki
      - run: bash .ci/check-release.sh
      - name: Build HTML documentation
        run: |
          make docs IKIWIKI="ikiwiki --url=https://example.invalid/slurm-bank/"
          test -s html/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-and-documentation
          path: |
            artifacts/*.tar.gz
            html/
          retention-days: 14
