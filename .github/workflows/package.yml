name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libswitch-perl
      - run: bash .ci/install-smoke.sh
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and install RPM on Rocky Linux 9
        run: |
          docker run --rm -v "$PWD:/work" -w /work rockylinux:9 bash -euc '
            dnf install -y epel-release
            dnf install -y git make rpm-build perl perl-Switch bash rsync findutils diffutils slurm
            git config --global --add safe.directory /work
            bash .ci/rpm.sh
          '
      - name: Save packages
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-packages
          path: artifacts/*.rpm
          if-no-files-found: ignore
          retention-days: 14
